# Render blueprint — same Flask backend, free tier compatible.
# Create the service from the Render dashboard, or import this file
# via New → Blueprint (Render reads render.yaml from the repo).
services:
  - type: web
    name: sknsh-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      # Values marked sync:false are entered once in the Render dashboard.
      - { key: PORT, value: "10000" }
      - { key: FLASK_DEBUG, value: "0" }
      - { key: JWT_SECRET, sync: false }
      - { key: JWT_EXPIRES_HOURS, value: "24" }
      - { key: CORS_ORIGINS, sync: false }
      - { key: ADMIN_ID, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ADMIN_NAME, value: "Portal Administrator" }
      - { key: APP_BRIDGE_URL, sync: false }
      - { key: BACKEND_BRIDGE_SECRET, sync: false }
      - { key: LOVABLE_API_KEY, sync: false }
      - { key: GOOGLE_DRIVE_API_KEY, sync: false }
      - { key: DRIVE_ROOT_FOLDER, value: "STUDENTS KA NOTES SHARING HUB" }
      - { key: MAX_UPLOAD_MB, value: "25" }
      - { key: SMTP_HOST, value: "smtp.gmail.com" }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: SMTP_FROM, sync: false }
      - { key: MASTER_ADMIN_ID, sync: false }
      - { key: MASTER_ADMIN_PASSWORD, sync: false }
